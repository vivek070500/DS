steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ds-enterprises-frontend'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ds-enterprises-frontend']

images:
  - 'gcr.io/$PROJECT_ID/ds-enterprises-frontend'

substitutions:
  _NEXT_PUBLIC_API_URL: 'http://localhost:8080'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''

